<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نمونه HTML محلی</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <span class="eyebrow">نمونه آزمایشی WebEngine</span>
    <h1>این یک ابزار HTML واقعی است</h1>
    <p>این صفحه از JavaScript، فایل CSS محلی و LocalStorage استفاده می‌کند.</p>
    <label for="note">یادداشت شما</label>
    <textarea id="note" placeholder="یک یادداشت بنویسید…"></textarea>
    <button id="save">ذخیره در LocalStorage</button>
    <p id="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
