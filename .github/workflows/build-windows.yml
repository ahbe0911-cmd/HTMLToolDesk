name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'HTMLToolDesk.spec'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Get font from official project
        shell: pwsh
        run: ./scripts/download_vazirmatn.ps1
      - name: Test persistence layer
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build portable EXE
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm HTMLToolDesk.spec
      - uses: actions/upload-artifact@v4
        with:
          name: HTMLToolDesk-Fast-Windows
          path: dist/HTMLToolDesk/
          compression-level: 1
          if-no-files-found: error
